<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Kevin Tom — Java backend and DevOps</title>
  <desc id="description">A restrained Matrix-inspired terminal banner with green code columns and Kevin Tom's engineering focus.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030604"/>
      <stop offset="0.55" stop-color="#071009"/>
      <stop offset="1" stop-color="#0B1710"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CFF8A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7CFF8A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7CFF8A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030604" stop-opacity="0"/>
      <stop offset="1" stop-color="#030604" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7CFF8A" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#2A5B36"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <g fill="#7CFF8A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" opacity="0.17">
    <text x="50" y="22">01</text><text x="50" y="44">11</text><text x="50" y="66">10</text><text x="50" y="88">00</text>
    <text x="50" y="110">λ1</text><text x="50" y="132">01</text><text x="50" y="154">10</text><text x="50" y="176">11</text>
    <text x="145" y="54">10</text><text x="145" y="76">01</text><text x="145" y="98">11</text><text x="145" y="120">00</text>
    <text x="145" y="142">01</text><text x="145" y="164">10</text><text x="145" y="186">λ0</text><text x="145" y="208">11</text>
    <text x="1040" y="30">11</text><text x="1040" y="52">01</text><text x="1040" y="74">00</text><text x="1040" y="96">10</text>
    <text x="1040" y="118">λ1</text><text x="1040" y="140">11</text><text x="1040" y="162">01</text><text x="1040" y="184">00</text>
    <text x="1134" y="70">01</text><text x="1134" y="92">10</text><text x="1134" y="114">11</text><text x="1134" y="136">00</text>
    <text x="1134" y="158">10</text><text x="1134" y="180">λ0</text><text x="1134" y="202">01</text><text x="1134" y="224">11</text>
  </g>

  <rect y="218" width="1200" height="102" rx="22" fill="url(#fade)"/>
  <rect x="86" y="58" width="1028" height="204" rx="14" fill="#071009" fill-opacity="0.78" stroke="#21422A"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="116" cy="84" r="5" fill="#F05D5E"/>
    <circle cx="134" cy="84" r="5" fill="#F2C14E"/>
    <circle cx="152" cy="84" r="5" fill="#31C763"/>
    <text x="174" y="89" fill="#8BA892" font-size="13">kevin@github: ~/profile</text>

    <text x="120" y="137" fill="#8BA892" font-size="16">$ whoami</text>
    <text x="120" y="187" fill="#F5FFF7" font-size="44" font-weight="700" letter-spacing="1">KEVIN TOM</text>
    <text x="120" y="224" fill="#7CFF8A" font-size="20" font-weight="600" filter="url(#soft-glow)">JAVA BACKEND  /  DEVOPS</text>

    <text x="846" y="137" fill="#8BA892" font-size="14">status</text>
    <circle cx="854" cy="165" r="5" fill="#7CFF8A" filter="url(#soft-glow)"/>
    <text x="870" y="170" fill="#D7E9DA" font-size="15">building reliable systems</text>
  </g>

  <rect x="120" y="246" width="960" height="2" fill="url(#edge)"/>
</svg>
