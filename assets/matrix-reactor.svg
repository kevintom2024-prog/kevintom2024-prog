<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Kevin Tom — animated Matrix engineering interface</title>
  <desc id="description">An animated terminal scene with falling code, a perspective grid, scanning light, glitching text, and a rotating wireframe reactor.</desc>

  <style>
    .rain-a { animation: rain 7s linear infinite; }
    .rain-b { animation: rain 9s linear -4s infinite; }
    .rain-c { animation: rain 11s linear -7s infinite; }
    .rain-d { animation: rain 8s linear -2s infinite; }
    .rain-e { animation: rain 10s linear -6s infinite; }
    .scan { animation: scan 4.8s cubic-bezier(.45,0,.55,1) infinite; }
    .floor-line { animation: floorPulse 2.8s ease-in-out infinite; }
    .floor-line:nth-child(2n) { animation-delay: -1.4s; }
    .reactor { transform-box: fill-box; transform-origin: center; animation: reactorSpin 18s linear infinite; }
    .reactor-reverse { transform-box: fill-box; transform-origin: center; animation: reactorSpinReverse 12s linear infinite; }
    .orbit-a { transform-box: fill-box; transform-origin: center; animation: orbit 7s linear infinite; }
    .orbit-b { transform-box: fill-box; transform-origin: center; animation: orbitReverse 10s linear infinite; }
    .core { animation: corePulse 2.2s ease-in-out infinite; }
    .particle-a { animation: particleA 5s ease-in-out infinite; }
    .particle-b { animation: particleB 6s ease-in-out -2s infinite; }
    .particle-c { animation: particleC 7s ease-in-out -4s infinite; }
    .glitch-main { animation: glitchMain 5s steps(1,end) infinite; }
    .glitch-a { animation: glitchA 5s steps(1,end) infinite; }
    .glitch-b { animation: glitchB 5s steps(1,end) infinite; }
    .role-1 { animation: role1 9s ease-in-out infinite; }
    .role-2 { animation: role2 9s ease-in-out infinite; }
    .role-3 { animation: role3 9s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1,end) infinite; }
    .status-dot { animation: status 1.7s ease-in-out infinite; }
    .data-flow { animation: dash 3s linear infinite; }

    @keyframes rain {
      from { transform: translateY(-430px); opacity: 0; }
      8% { opacity: .75; }
      82% { opacity: .48; }
      to { transform: translateY(520px); opacity: 0; }
    }
    @keyframes scan {
      0%, 8% { transform: translateY(-70px); opacity: 0; }
      18% { opacity: .75; }
      72% { opacity: .38; }
      92%, 100% { transform: translateY(520px); opacity: 0; }
    }
    @keyframes floorPulse {
      0%, 100% { opacity: .12; }
      50% { opacity: .55; }
    }
    @keyframes reactorSpin { to { transform: rotate(360deg); } }
    @keyframes reactorSpinReverse { to { transform: rotate(-360deg); } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbitReverse { to { transform: rotate(-360deg); } }
    @keyframes corePulse {
      0%, 100% { opacity: .72; transform: scale(.94); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes particleA {
      0%, 100% { transform: translate(0, 0); opacity: .2; }
      50% { transform: translate(16px, -24px); opacity: 1; }
    }
    @keyframes particleB {
      0%, 100% { transform: translate(0, 0); opacity: .3; }
      50% { transform: translate(-22px, 15px); opacity: .95; }
    }
    @keyframes particleC {
      0%, 100% { transform: translate(0, 0); opacity: .18; }
      50% { transform: translate(12px, 22px); opacity: .85; }
    }
    @keyframes glitchMain {
      0%, 90%, 94%, 100% { transform: translate(0,0); }
      91% { transform: translate(-3px,1px); }
      92% { transform: translate(4px,-1px); }
      93% { transform: translate(-1px,0); }
    }
    @keyframes glitchA {
      0%, 89%, 94%, 100% { opacity: 0; transform: translate(0,0); }
      90% { opacity: .8; transform: translate(5px,-2px); }
      91% { opacity: .35; transform: translate(-4px,2px); }
      92% { opacity: .7; transform: translate(2px,0); }
      93% { opacity: 0; }
    }
    @keyframes glitchB {
      0%, 90%, 95%, 100% { opacity: 0; transform: translate(0,0); }
      91% { opacity: .75; transform: translate(-5px,2px); }
      92% { opacity: .35; transform: translate(5px,-1px); }
      93% { opacity: .65; transform: translate(-2px,0); }
      94% { opacity: 0; }
    }
    @keyframes role1 {
      0%, 27% { opacity: 1; transform: translateY(0); }
      31%, 96% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes role2 {
      0%, 29% { opacity: 0; transform: translateY(8px); }
      34%, 60% { opacity: 1; transform: translateY(0); }
      64%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes role3 {
      0%, 62% { opacity: 0; transform: translateY(8px); }
      67%, 93% { opacity: 1; transform: translateY(0); }
      98%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes status {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #7CFF8A); }
    }
    @keyframes dash { to { stroke-dashoffset: -60; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .role-2, .role-3, .glitch-a, .glitch-b { display: none; }
    }
  </style>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010302"/>
      <stop offset=".5" stop-color="#061009"/>
      <stop offset="1" stop-color="#0B1D11"/>
    </linearGradient>
    <radialGradient id="reactorGlow">
      <stop offset="0" stop-color="#B9FFBF" stop-opacity=".95"/>
      <stop offset=".28" stop-color="#4DFF65" stop-opacity=".52"/>
      <stop offset=".68" stop-color="#20C942" stop-opacity=".12"/>
      <stop offset="1" stop-color="#20C942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CFF8A" stop-opacity="0"/>
      <stop offset=".48" stop-color="#7CFF8A" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#C9FFCF" stop-opacity=".42"/>
      <stop offset=".52" stop-color="#7CFF8A" stop-opacity=".08"/>
      <stop offset="1" stop-color="#7CFF8A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7CFF8A" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frameClip">
      <rect width="1200" height="460" rx="22"/>
    </clipPath>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="heavyGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="460" fill="url(#background)"/>
    <rect width="1200" height="460" fill="url(#microGrid)"/>

    <!-- Perspective floor -->
    <g stroke="#54F16A" fill="none">
      <path d="M600 250L-80 460M600 250L80 460M600 250L240 460M600 250L400 460M600 250L520 460M600 250L600 460M600 250L680 460M600 250L800 460M600 250L960 460M600 250L1120 460M600 250L1280 460" opacity=".2"/>
      <path class="floor-line" d="M486 285H714" opacity=".18"/>
      <path class="floor-line" d="M426 315H774" opacity=".25"/>
      <path class="floor-line" d="M346 352H854" opacity=".32"/>
      <path class="floor-line" d="M238 400H962" opacity=".42"/>
      <path class="floor-line" d="M88 458H1112" opacity=".52"/>
    </g>

    <!-- Falling code -->
    <g fill="#7CFF8A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g class="rain-a" opacity=".48">
        <text x="35" y="20">01</text><text x="35" y="44">11</text><text x="35" y="68">λ0</text><text x="35" y="92">10</text><text x="35" y="116">00</text><text x="35" y="140">01</text><text x="35" y="164">11</text>
      </g>
      <g class="rain-b" opacity=".38">
        <text x="105" y="20">10</text><text x="105" y="44">01</text><text x="105" y="68">11</text><text x="105" y="92">00</text><text x="105" y="116">λ1</text><text x="105" y="140">10</text>
      </g>
      <g class="rain-c" opacity=".45">
        <text x="175" y="20">λ1</text><text x="175" y="44">00</text><text x="175" y="68">01</text><text x="175" y="92">10</text><text x="175" y="116">11</text><text x="175" y="140">01</text>
      </g>
      <g class="rain-d" opacity=".38">
        <text x="1080" y="20">11</text><text x="1080" y="44">01</text><text x="1080" y="68">00</text><text x="1080" y="92">λ0</text><text x="1080" y="116">10</text><text x="1080" y="140">11</text>
      </g>
      <g class="rain-e" opacity=".5">
        <text x="1150" y="20">01</text><text x="1150" y="44">10</text><text x="1150" y="68">λ1</text><text x="1150" y="92">11</text><text x="1150" y="116">00</text><text x="1150" y="140">01</text><text x="1150" y="164">10</text>
      </g>
    </g>

    <!-- Terminal frame -->
    <path d="M68 48H738L770 80V356L738 388H68L36 356V80Z" fill="#030806" fill-opacity=".84" stroke="#286037"/>
    <path d="M58 80H748M58 356H748" stroke="#21422A"/>
    <circle cx="68" cy="65" r="5" fill="#F05D5E"/>
    <circle cx="86" cy="65" r="5" fill="#F2C14E"/>
    <circle cx="104" cy="65" r="5" fill="#31C763"/>
    <text x="126" y="70" fill="#7C9980" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">matrix://kevin/core</text>

    <!-- Glitch identity -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <text x="78" y="136" fill="#7C9980" font-size="15">$ ./identify --subject</text>
      <text class="glitch-a" x="76" y="205" fill="#FF315A" font-size="54" letter-spacing="2" opacity="0">KEVIN TOM</text>
      <text class="glitch-b" x="80" y="205" fill="#22D3EE" font-size="54" letter-spacing="2" opacity="0">KEVIN TOM</text>
      <text class="glitch-main" x="78" y="205" fill="#F5FFF7" font-size="54" letter-spacing="2">KEVIN TOM</text>
      <text x="78" y="251" fill="#7C9980" font-size="14">$ stream --focus</text>
      <g fill="#7CFF8A" font-size="24" filter="url(#glow)">
        <text class="role-1" x="78" y="291">JAVA BACKEND</text>
        <text class="role-2" x="78" y="291" opacity="0">DEVOPS AUTOMATION</text>
        <text class="role-3" x="78" y="291" opacity="0">CLOUD SYSTEMS</text>
      </g>
      <rect class="cursor" x="78" y="315" width="12" height="22" fill="#7CFF8A"/>
      <text x="102" y="332" fill="#9AB7A0" font-size="14">building reliable systems...</text>
    </g>

    <!-- Animated 3D reactor -->
    <g transform="translate(940 218)">
      <circle r="174" fill="url(#reactorGlow)" opacity=".32"/>
      <g class="orbit-a" fill="none" stroke="#7CFF8A" stroke-width="1.2" opacity=".46">
        <ellipse rx="150" ry="54"/>
        <circle cx="150" r="5" fill="#B9FFBF" filter="url(#glow)"/>
      </g>
      <g class="orbit-b" fill="none" stroke="#31C763" stroke-width="1" opacity=".55" transform="rotate(58)">
        <ellipse rx="132" ry="46"/>
        <circle cx="-132" r="4" fill="#7CFF8A" filter="url(#glow)"/>
      </g>
      <g class="reactor-reverse" fill="none" stroke="#397B47" opacity=".6">
        <polygon points="0,-132 114,-66 114,66 0,132 -114,66 -114,-66"/>
        <polygon points="0,-106 92,-53 92,53 0,106 -92,53 -92,-53"/>
      </g>
      <g class="reactor" fill="none" stroke="#7CFF8A" stroke-width="1.4" filter="url(#glow)">
        <path d="M-70-70L42-92L86-20L70 70L-42 92L-86 20Z"/>
        <path d="M-42-92L70-70L86 20L42 92L-70 70L-86-20Z"/>
        <path d="M-70-70L-42-92M42-92L70-70M86-20L86 20M70 70L42 92M-42 92L-70 70M-86 20L-86-20"/>
        <path class="data-flow" d="M-70-70L42-92L86-20L70 70L-42 92L-86 20Z" stroke="#D0FFD4" stroke-dasharray="8 22" stroke-width="2.5"/>
      </g>
      <g class="core" filter="url(#heavyGlow)">
        <circle r="38" fill="#36E654" opacity=".16"/>
        <circle r="24" fill="#7CFF8A" opacity=".22"/>
        <circle r="8" fill="#E5FFE8"/>
      </g>
      <circle class="particle-a" cx="-124" cy="-94" r="3" fill="#7CFF8A"/>
      <circle class="particle-b" cx="122" cy="-78" r="4" fill="#31C763"/>
      <circle class="particle-c" cx="104" cy="112" r="3" fill="#B9FFBF"/>
    </g>

    <!-- System telemetry -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="812" y="50" fill="#7C9980">REACTOR // MK-II</text>
      <circle class="status-dot" cx="814" cy="70" r="4" fill="#7CFF8A"/>
      <text x="828" y="74" fill="#D8E9DA">SYSTEM ONLINE</text>
      <text x="1035" y="365" fill="#7C9980">JAVA 21</text>
      <text x="1035" y="383" fill="#7C9980">SPRING</text>
      <text x="1035" y="401" fill="#7C9980">AZURE</text>
      <text x="1035" y="419" fill="#7C9980">ANSIBLE</text>
    </g>

    <rect class="scan" x="0" y="-70" width="1200" height="76" fill="url(#scanGradient)" pointer-events="none"/>
    <path d="M1 22V1H22M1178 1H1199V22M1 438V459H22M1178 459H1199V438" fill="none" stroke="#7CFF8A" stroke-width="2" opacity=".7"/>
  </g>

  <rect x="1" y="1" width="1198" height="458" rx="21" fill="none" stroke="#2A5B36" stroke-width="2"/>
</svg>
