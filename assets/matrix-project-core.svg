<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Student Management Platform system architecture</title>
  <desc id="description">An animated Matrix-style architecture diagram connecting a client, Spring Boot service, MySQL database, Azure pipeline, tests, and Ansible deployment.</desc>

  <style>
    .pulse-a { animation: pulseA 4s linear infinite; }
    .pulse-b { animation: pulseB 5s linear -2s infinite; }
    .pulse-c { animation: pulseC 4.5s linear -1s infinite; }
    .node { animation: node 3s ease-in-out infinite; }
    .node:nth-of-type(2n) { animation-delay: -1.5s; }
    .ring { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
    .ring-reverse { transform-box: fill-box; transform-origin: center; animation: spinReverse 8s linear infinite; }
    .scan { animation: scan 4s ease-in-out infinite; }
    .bar-a { animation: bar 2.4s ease-in-out infinite; }
    .bar-b { animation: bar 2.4s ease-in-out -.8s infinite; }
    .bar-c { animation: bar 2.4s ease-in-out -1.6s infinite; }
    .blink { animation: blink 1s steps(1,end) infinite; }

    @keyframes pulseA { to { offset-distance: 100%; } }
    @keyframes pulseB { to { offset-distance: 100%; } }
    @keyframes pulseC { to { offset-distance: 100%; } }
    @keyframes node {
      0%, 100% { filter: drop-shadow(0 0 2px #31C763); }
      50% { filter: drop-shadow(0 0 12px #7CFF8A); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinReverse { to { transform: rotate(-360deg); } }
    @keyframes scan {
      0%, 100% { transform: translateY(-20px); opacity: .15; }
      50% { transform: translateY(420px); opacity: .75; }
    }
    @keyframes bar {
      0%, 100% { transform: scaleX(.2); opacity: .35; }
      50% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#010302"/><stop offset=".52" stop-color="#061009"/><stop offset="1" stop-color="#0A1A0E"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D2112" stop-opacity=".92"/><stop offset="1" stop-color="#030806" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7CFF8A" stop-opacity="0"/><stop offset=".5" stop-color="#7CFF8A" stop-opacity=".16"/><stop offset="1" stop-color="#7CFF8A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#7CFF8A" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="500" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>
    <path d="M35 80H1165M35 422H1165" stroke="#21422A"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="44" y="51" fill="#7CFF8A" font-size="14">PROJECT // 001</text>
      <text x="44" y="108" fill="#F5FFF7" font-size="28" font-weight="700">STUDENT MANAGEMENT PLATFORM</text>
      <text x="44" y="137" fill="#79947F" font-size="13">FULL SIGNAL PATH // REQUEST → TEST → BUILD → DEPLOY</text>

      <!-- Connection graph -->
      <g fill="none" stroke="#2B6B39" stroke-width="2">
        <path id="pathA" d="M168 250C260 170 340 170 438 248"/>
        <path id="pathB" d="M474 248C558 170 660 170 746 248"/>
        <path id="pathC" d="M474 272C558 350 660 350 746 272"/>
        <path id="pathD" d="M782 248C866 170 958 170 1040 248"/>
        <path id="pathE" d="M782 272C866 350 958 350 1040 272"/>
      </g>
      <g fill="#B8FFBF" filter="url(#glow)">
        <circle r="5" class="pulse-a" style="offset-path:path('M168 250C260 170 340 170 438 248')"/>
        <circle r="5" class="pulse-b" style="offset-path:path('M474 248C558 170 660 170 746 248')"/>
        <circle r="5" class="pulse-c" style="offset-path:path('M474 272C558 350 660 350 746 272')"/>
        <circle r="5" class="pulse-a" style="offset-path:path('M782 248C866 170 958 170 1040 248')"/>
        <circle r="5" class="pulse-b" style="offset-path:path('M782 272C866 350 958 350 1040 272')"/>
      </g>

      <!-- Client -->
      <g class="node" transform="translate(110 207)">
        <path d="M0 0H116V72H0Z" fill="url(#panel)" stroke="#4AAD59"/>
        <path d="M16 56H100M44 72L36 86H80L72 72" fill="none" stroke="#7CFF8A"/>
        <text x="58" y="31" text-anchor="middle" fill="#F5FFF7" font-size="13">CLIENT</text>
        <text x="58" y="48" text-anchor="middle" fill="#6F8E76" font-size="10">THYMELEAF</text>
      </g>

      <!-- Spring reactor -->
      <g transform="translate(456 260)">
        <circle r="68" fill="#071009" stroke="#4AAD59"/>
        <g class="ring" fill="none" stroke="#7CFF8A" stroke-dasharray="8 12">
          <circle r="54"/><path d="M-38-38L38 38M38-38L-38 38"/>
        </g>
        <g class="ring-reverse" fill="none" stroke="#31C763">
          <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19"/>
        </g>
        <circle r="10" fill="#7CFF8A" filter="url(#glow)"/>
        <text y="92" text-anchor="middle" fill="#F5FFF7" font-size="13">SPRING BOOT</text>
        <text y="109" text-anchor="middle" fill="#6F8E76" font-size="10">JAVA 21 // REST // JPA</text>
      </g>

      <!-- Data and validation nodes -->
      <g class="node" transform="translate(716 165)">
        <path d="M0 14C0-5 124-5 124 14V82C124 101 0 101 0 82Z" fill="url(#panel)" stroke="#4AAD59"/>
        <ellipse cx="62" cy="14" rx="62" ry="16" fill="#0A1A0E" stroke="#7CFF8A"/>
        <text x="62" y="50" text-anchor="middle" fill="#F5FFF7" font-size="13">MYSQL</text>
        <text x="62" y="68" text-anchor="middle" fill="#6F8E76" font-size="10">PERSISTENCE</text>
      </g>
      <g class="node" transform="translate(716 314)">
        <rect width="124" height="76" rx="8" fill="url(#panel)" stroke="#4AAD59"/>
        <path d="M25 40L48 58L98 17" fill="none" stroke="#7CFF8A" stroke-width="5"/>
        <text x="62" y="97" text-anchor="middle" fill="#F5FFF7" font-size="13">JUNIT</text>
      </g>

      <!-- Delivery nodes -->
      <g class="node" transform="translate(1016 169)">
        <path d="M0 0H130V82H0Z" fill="url(#panel)" stroke="#4AAD59"/>
        <rect class="bar-a" x="18" y="20" width="94" height="7" fill="#7CFF8A" transform-origin="18px"/>
        <rect class="bar-b" x="18" y="38" width="94" height="7" fill="#31C763" transform-origin="18px"/>
        <rect class="bar-c" x="18" y="56" width="94" height="7" fill="#1C6629" transform-origin="18px"/>
        <text x="65" y="106" text-anchor="middle" fill="#F5FFF7" font-size="13">AZURE PIPELINES</text>
      </g>
      <g class="node" transform="translate(1016 318)">
        <path d="M0 0H130V72H0Z" fill="url(#panel)" stroke="#4AAD59"/>
        <path d="M20 54L42 18L64 54L86 18L108 54" fill="none" stroke="#7CFF8A" stroke-width="3"/>
        <text x="65" y="94" text-anchor="middle" fill="#F5FFF7" font-size="13">ANSIBLE</text>
      </g>

      <text x="44" y="462" fill="#63806A" font-size="11">STATUS</text>
      <circle class="blink" cx="100" cy="458" r="5" fill="#7CFF8A"/>
      <text x="116" y="462" fill="#B8FFBF" font-size="11">LEARNING LAB ONLINE</text>
      <text x="1148" y="462" text-anchor="end" fill="#63806A" font-size="11">CLICK IMAGE TO OPEN SOURCE</text>
    </g>

    <rect class="scan" x="0" y="-20" width="1200" height="55" fill="url(#scanGradient)"/>
    <path d="M1 22V1H22M1178 1H1199V22M1 478V499H22M1178 499H1199V478" fill="none" stroke="#7CFF8A" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#2A5B36" stroke-width="2"/>
</svg>
